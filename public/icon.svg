<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#07071a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c4ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="block-i" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="block-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="block-t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="block-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.07" stroke="#c084fc" stroke-width="1">
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>
    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
  </g>

  <!-- Glow circle -->
  <ellipse cx="256" cy="220" rx="200" ry="160" fill="url(#glow)"/>

  <!-- Tetromino blocks — arranged like falling pieces -->
  <!-- I-piece horizontal (top) -->
  <g filter="url(#shadow)">
    <rect x="96" y="88" width="56" height="56" rx="8" fill="url(#block-i)" opacity="0.9"/>
    <rect x="96" y="88" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="160" y="88" width="56" height="56" rx="8" fill="url(#block-i)" opacity="0.9"/>
    <rect x="160" y="88" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="224" y="88" width="56" height="56" rx="8" fill="url(#block-i)" opacity="0.9"/>
    <rect x="224" y="88" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="288" y="88" width="56" height="56" rx="8" fill="url(#block-i)" opacity="0.9"/>
    <rect x="288" y="88" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- T-piece -->
  <g filter="url(#shadow)">
    <rect x="352" y="88" width="56" height="56" rx="8" fill="url(#block-t)" opacity="0.85"/>
    <rect x="352" y="88" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="352" y="152" width="56" height="56" rx="8" fill="url(#block-t)" opacity="0.85"/>
    <rect x="352" y="152" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="288" y="152" width="56" height="56" rx="8" fill="url(#block-t)" opacity="0.85"/>
    <rect x="288" y="152" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- L-piece -->
  <g filter="url(#shadow)">
    <rect x="96" y="152" width="56" height="56" rx="8" fill="url(#block-l)" opacity="0.85"/>
    <rect x="96" y="152" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="96" y="216" width="56" height="56" rx="8" fill="url(#block-l)" opacity="0.85"/>
    <rect x="96" y="216" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="160" y="216" width="56" height="56" rx="8" fill="url(#block-l)" opacity="0.85"/>
    <rect x="160" y="216" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- S-piece -->
  <g filter="url(#shadow)">
    <rect x="224" y="216" width="56" height="56" rx="8" fill="url(#block-s)" opacity="0.85"/>
    <rect x="224" y="216" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="288" y="216" width="56" height="56" rx="8" fill="url(#block-s)" opacity="0.85"/>
    <rect x="288" y="216" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="160" y="280" width="56" height="56" rx="8" fill="url(#block-s)" opacity="0.85"/>
    <rect x="160" y="280" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="224" y="280" width="56" height="56" rx="8" fill="url(#block-s)" opacity="0.85"/>
    <rect x="224" y="280" width="56" height="14" rx="8" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- TETRIX text -->
  <text
    x="256" y="420"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-weight="900"
    font-size="88"
    letter-spacing="6"
    fill="url(#text-grad)"
    filter="url(#shadow)"
  >TETRIX</text>

  <!-- Underline accent -->
  <rect x="96" y="434" width="320" height="4" rx="2" fill="url(#text-grad)" opacity="0.6"/>
</svg>
